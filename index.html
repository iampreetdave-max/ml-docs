<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Docs Hub</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e6e6e3;
    --accent: #2f5bea; --accent-ink: #fff; --code-bg: #f3f3f0; --ok: #1a7f37; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1b1b1f; --text: #ececef; --muted: #9a9aa2; --line: #2c2c32;
      --accent: #7b9bff; --accent-ink: #0d0d10; --code-bg: #232329; --ok: #4ac26b; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 18px; }
  #menuBtn { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 4px 10px; font-size: 18px; cursor: pointer; }
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 57px); }
  nav { border-right: 1px solid var(--line); padding: 16px; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; background: var(--panel); }
  nav input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; margin-bottom: 12px; }
  nav a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
  nav a:hover { background: var(--code-bg); }
  nav a.active { background: var(--accent); color: var(--accent-ink); }
  nav small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 14px 10px 4px; }
  main { padding: 32px clamp(16px, 4vw, 56px) 120px; max-width: 900px; min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 34px; }
  h2 { margin-top: 36px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  h3 { margin-bottom: 6px; }
  .tag { color: var(--muted); margin: 0 0 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .meta a, .pill { font-size: 14px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--accent); text-decoration: none; }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.5; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  p code, li code, dd code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  dl dt { font-weight: 600; margin-top: 12px; }
  dl dd { margin: 2px 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 20px; }
  .card { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: inherit; text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .card b { display: block; margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 14px; }

  /* Review widget — always visible bottom-right */
  #reviewBtn { position: fixed; right: 20px; bottom: 20px; z-index: 50; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 20px; font: 600 15px system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  #reviewPanel { position: fixed; right: 20px; bottom: 76px; z-index: 50; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  #reviewPanel[hidden] { display: none; }
  #reviewPanel h3 { margin: 0 0 4px; }
  #reviewPanel p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  #reviewPanel label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  #reviewPanel textarea { width: 100%; min-height: 140px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  #reviewPanel input[type=file] { width: 100%; font-size: 14px; color: var(--text); }
  #fileList { font-size: 13px; color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
  #reviewPanel button[type=submit] { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 600 15px system-ui, sans-serif; cursor: pointer; }
  #reviewPanel button[disabled] { opacity: .6; cursor: wait; }
  #status { margin-top: 10px; font-size: 14px; min-height: 1.2em; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }

  @media (max-width: 760px) {
    #menuBtn { display: block; }
    .layout { grid-template-columns: 1fr; }
    nav { position: fixed; top: 57px; left: 0; width: 80vw; max-width: 300px; z-index: 20; transform: translateX(-100%); transition: transform .2s; }
    nav.open { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.3); }
    h1 { font-size: 28px; }
  }
  .toc a { padding: 3px 10px 3px 22px; font-size: 13px; color: var(--muted); }
  .toc a:hover { color: var(--text); }
  main table { border-collapse: collapse; display: block; overflow-x: auto; margin: 12px 0; font-size: 14px; }
  main th, main td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  main th { background: var(--code-bg); }
  main blockquote { margin: 0 0 16px; padding: 4px 16px; border-left: 4px solid var(--accent); color: var(--muted); }
  main h2, main h3 { scroll-margin-top: 70px; }
  pre code.hljs { padding: 0; background: none; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
</head>
<body>
<header>
  <button id="menuBtn" aria-label="Toggle library list">☰</button>
  <a href="#">ML Docs Hub</a>
</header>
<div class="layout">
  <nav id="nav">
    <input id="search" type="search" placeholder="Filter libraries…" aria-label="Filter libraries">
    <div id="navLinks"></div>
  </nav>
  <main id="content"></main>
</div>

<button id="reviewBtn" aria-expanded="false" aria-controls="reviewPanel">💬 Leave a review</button>
<form id="reviewPanel" hidden>
  <h3>Share your feedback</h3>
  <p>Tell us anything.</p>
  <label for="reviewText">Your review</label>
  <textarea id="reviewText" placeholder="Write as much as you want…"></textarea>
  <label for="reviewFiles">Attachments</label>
  <input id="reviewFiles" type="file" multiple>
  <ul id="fileList"></ul>
  <button type="submit">Submit review</button>
  <div id="status" role="status"></div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
// ===== Supabase config — paste your values here =====
const SUPABASE_URL = 'https://jzjsjlracxjjsegvxhms.supabase.co';        // e.g. https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6anNqbHJhY3hqanNlZ3Z4aG1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzQyMzMsImV4cCI6MjEwNjkxMDIzM30.xtsFTgnvQ-rx4Gv-7JYAA4fr86ysEh5wXtcK_6h4ueE';
const BUCKET = 'review-files';
const TABLE = 'reviews';

// ===== Documentation index (full docs live in docs/<id>.md) =====
const LIBS = [
  { id:'numpy',        name:'NumPy',                     cat:'Data & Math',       tag:'N-dimensional arrays and numerical computing.' },
  { id:'pandas',       name:'pandas',                    cat:'Data & Math',       tag:'DataFrames for tabular and time-series data.' },
  { id:'scipy',        name:'SciPy',                     cat:'Data & Math',       tag:'Optimization, statistics, sparse matrices, signal processing.' },
  { id:'matplotlib',   name:'Matplotlib',                cat:'Visualization',     tag:'Static, animated and interactive plots.' },
  { id:'seaborn',      name:'Seaborn',                   cat:'Visualization',     tag:'Statistical visualization on top of Matplotlib.' },
  { id:'sklearn',      name:'scikit-learn',              cat:'Classical ML',      tag:'Classification, regression, clustering, pipelines, model selection.' },
  { id:'statsmodels',  name:'statsmodels',               cat:'Classical ML',      tag:'Statistical models, inference and time series.' },
  { id:'xgboost',      name:'XGBoost',                   cat:'Gradient Boosting', tag:'Scalable gradient-boosted decision trees.' },
  { id:'lightgbm',     name:'LightGBM',                  cat:'Gradient Boosting', tag:'Fast, histogram-based gradient boosting.' },
  { id:'catboost',     name:'CatBoost',                  cat:'Gradient Boosting', tag:'Gradient boosting with native categorical features.' },
  { id:'tensorflow',   name:'TensorFlow',                cat:'Deep Learning',     tag:'End-to-end ML platform by Google.' },
  { id:'keras',        name:'Keras',                     cat:'Deep Learning',     tag:'High-level, multi-backend deep learning API.' },
  { id:'pytorch',      name:'PyTorch',                   cat:'Deep Learning',     tag:'Tensors and dynamic neural networks with GPU acceleration.' },
  { id:'jax',          name:'JAX',                       cat:'Deep Learning',     tag:'Composable transformations: grad, jit, vmap.' },
  { id:'transformers', name:'Hugging Face Transformers', cat:'NLP & LLMs',        tag:'Pretrained models for text, vision and audio.' },
];

// ===== Rendering =====
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
const cache = {};
let current = null, toc = '';

// Hash format: #<lib> or #<lib>:<heading-id>
const route = () => { const [lib, sec] = location.hash.slice(1).split(':'); return { lib, sec }; };

function renderNav(filter = '') {
  const f = filter.toLowerCase();
  let html = '', cat = '';
  for (const l of LIBS.filter(l => (l.name + l.cat + l.tag).toLowerCase().includes(f))) {
    if (l.cat !== cat) { cat = l.cat; html += `<small>${cat}</small>`; }
    html += `<a href="#${l.id}" data-id="${l.id}">${l.name}</a>`;
    if (l.id === current) html += toc;
  }
  $('#navLinks').innerHTML = html || '<p style="color:var(--muted)">No match.</p>';
  document.querySelectorAll('#navLinks a[data-id]').forEach(a => a.classList.toggle('active', a.dataset.id === current));
}

async function renderPage() {
  const { lib: id, sec } = route();
  const lib = LIBS.find(l => l.id === id);
  const main = $('#content');
  $('#nav').classList.remove('open');

  if (lib && id === current) return jumpTo(sec); // same page, just jump to section

  current = lib ? id : null; toc = '';
  if (!lib) {
    main.innerHTML = `<h1>ML Docs Hub</h1>
      <p class="tag">In-depth documentation for ${LIBS.length} popular machine learning libraries.</p>
      <div class="grid">${LIBS.map(l => `<a class="card" href="#${l.id}"><b>${l.name}</b><span>${l.tag}</span></a>`).join('')}</div>`;
    renderNav($('#search').value); window.scrollTo(0, 0);
    return;
  }

  main.innerHTML = '<p class="tag">Loading…</p>';
  try {
    cache[id] ??= await fetch(`docs/${id}.md`).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
  } catch {
    main.innerHTML = `<h1>${lib.name}</h1><p class="tag">Couldn't load this page. Please refresh.</p>`;
    return;
  }
  if (current !== id) return; // user navigated away while loading
  main.innerHTML = marked.parse(cache[id]); // ponytail: our own trusted Markdown, so no sanitizer
  main.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  main.querySelectorAll('h2, h3').forEach(h => h.id = slug(h.textContent));
  toc = '<div class="toc">' + [...main.querySelectorAll('h2')]
    .map(h => `<a href="#${id}:${h.id}">${esc(h.textContent)}</a>`).join('') + '</div>';
  renderNav($('#search').value);
  jumpTo(sec);
}

function jumpTo(sec) {
  const el = sec && document.getElementById(sec);
  el ? el.scrollIntoView() : window.scrollTo(0, 0);
}

$('#search').addEventListener('input', e => renderNav(e.target.value));
$('#menuBtn').addEventListener('click', () => $('#nav').classList.toggle('open'));
window.addEventListener('hashchange', renderPage);
renderNav(); renderPage();

// ===== Review widget =====
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const panel = $('#reviewPanel'), btn = $('#reviewBtn'), status = $('#status');
const fileInput = $('#reviewFiles'), text = $('#reviewText');

btn.addEventListener('click', () => {
  panel.hidden = !panel.hidden;
  btn.setAttribute('aria-expanded', String(!panel.hidden));
  if (!panel.hidden) text.focus();
});

fileInput.addEventListener('change', () => {
  $('#fileList').innerHTML = [...fileInput.files]
    .map(f => `<li>${esc(f.name)} (${(f.size / 1024).toFixed(1)} KB)</li>`).join('');
});

function setStatus(msg, cls = '') { status.textContent = msg; status.className = cls; }

panel.addEventListener('submit', async e => {
  e.preventDefault();
  const message = text.value.trim();
  const files = [...fileInput.files];
  if (!message && !files.length) return setStatus('Please write something or attach a file.', 'err');

  const submit = panel.querySelector('button[type=submit]');
  submit.disabled = true;
  try {
    // Upload files first; the review row stores their paths.
    const folder = crypto.randomUUID();
    const uploaded = [];
    for (const [i, f] of files.entries()) {
      setStatus(`Uploading ${i + 1}/${files.length}: ${f.name}…`);
      const path = `${folder}/${i}_${f.name.replace(/[^\w.\-]+/g, '_')}`;
      const { error } = await sb.storage.from(BUCKET)
        .upload(path, f, { contentType: f.type || 'application/octet-stream' });
      if (error) throw new Error(`Upload failed for ${f.name}: ${error.message}`);
      uploaded.push({ path, name: f.name, size: f.size, type: f.type });
    }

    setStatus('Saving review…');
    const { error } = await sb.from(TABLE).insert({ message, files: uploaded, page: location.hash || '#home' });
    if (error) throw new Error(error.message);

    panel.reset(); $('#fileList').innerHTML = '';
    setStatus('Thanks! Your review was submitted.', 'ok');
  } catch (err) {
    setStatus(err.message, 'err'); // form is kept so the user doesn't lose their text
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
